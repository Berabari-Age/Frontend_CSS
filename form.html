<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Form</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="forms.css" rel="stylesheet">
    </head>
    <body>
        <h3>Welcome to Goshen Health & Tech Consult <br><span>GHaTC</span></h3>
        <p>Feel free to fill the form below</p>
    <form action="results.html" method="post">
        <div>
            <label for="last name">Last Name</label>
            <input type="text" id="Last Name" placeholder="Last Name" required>
        </div>
        <div>
            <label for="first name">First Name</label>
            <input type="text" id="First Name" placeholder="First Name" required>
        </div>
        Gender
        <div>
            <label for="male">Male</label>
            <input type="radio" name="gender" id="male" value="male">

            <label for="female">Female</label>
            <input type="radio" name="gender" id="female" value="female">
        </div>
        
        <div>
            <label for="age">Age</label>
            <input type="number" name="age" id="age" min="1" max="200">
        </div>
        <div>
            <label for="birthdate">Birthdate</label>
            <input type="date" name="date" id="date" min="1990-01-01" max="2024-01-01">
        </div>
        Preferred Services
        <div>
            <label for="research writing">Research writing Tutorial</label>
            <input type="checkbox" name="research writing" id="research writing">
        </div>
        <div>
            <label for="medical updates">Medical updates</label>
            <input type="checkbox" name="medical updates" id="medical updates">
        </div>
        <div>
            <label for="ai tools training">AI Tools Training</label>
            <input type="checkbox" name="ai tools training" id="ai tools training">
        </div>
        <div>
            <label for="clinical skills upgrading">Clinical Skills Upgrading</label>
            <input type="checkbox" name="clinical skills upgrading" id="clinical skills upgrading">
        </div>
        <div>
            <label for="preferred mode of training">Mode of training</label>
            <select name="mode of training" id="mode of training">
                <option value="online">Online</option>
                <option value="onsite">Onsite</option>
                <option value="hybrid">Hybrid</option>                
            </select>
        </div>
        <br>
        <div>
            <label for="bio">About self</label>
            <textarea name="bio" id="about self"></textarea>
        </div>
        <br>
        <div>
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="email" required>
        </div>
        <div>
            <label>Password</label>
            <input type="password" name="pasword">
        </div>
        <div>
            <label>Confirm Password</label>
            <input type="password" name="confirm pasword">
        </div>
        
        <div>
            <button type="submit">Submit</button>
            <button type="reset">reset</button>
        </div>
    </form>
        
    </body>
</html>
